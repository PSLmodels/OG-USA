name: Build and Deploy Jupyter Book documentation
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'docs/**.png'
      - 'docs/**.py'
      - 'docs/book/content/calibration/images/**.png'
      - 'docs/book/**.yml'
      - 'docs/book/**.bib'
      - '**.md'
      - 'docs/book/content/api/**.rst'
      - 'ogusa/**.py'
jobs:
  build:
    if: github.repository == 'PSLmodels/OG-USA'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install package and docs dependencies
        run: uv sync --extra dev --extra docs

      - name: Build # Build Jupyter Book
        run: |
          uv run python -m ipykernel install --user --name=ogusa-dev
          uv run make documentation
